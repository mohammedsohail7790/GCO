name: gco-staging

# GCO STAGING stack: a completely separate copy of the platform (own Postgres, Redis, secrets, volumes, ports) holding ONLY
# fictional data, for the owner to test safely. It shares nothing with production. Not verified under Docker in the
# development environment (Docker is not installed there): the same application was verified locally as a second stack with a
# separate database - see docs/staging-environment.md. Verify with `docker compose -f docker-compose.staging.yml up --build`
# on a Docker host before relying on it.
#
#   cp .env.staging.example .env.staging   # then fill in the secrets (never reuse production values)
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build

x-logging: &default-logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

x-build-args: &build-args
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set the staging URL in .env.staging}
  NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:?set the staging realtime URL in .env.staging}
  NEXT_PUBLIC_GCO_ENVIRONMENT: staging

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-gco}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gco}?schema=public
  REDIS_URL: redis://redis:6379
  GCO_ENVIRONMENT: staging
  ALLOW_DEV_ADAPTERS: 'true'
  AI_PROVIDER: mock
  AI_MASTER_SWITCH: disabled # AI is disabled in staging too (CEO direction); the mock provider is never reached

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Staging must never starve production on the shared 8 GB host (docs/readiness/20). Tune after the read-only memory check.
    mem_limit: 256m
    cpus: 0.4
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.staging}
      POSTGRES_DB: ${POSTGRES_DB:-gco}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gco}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Staging must never starve production on the shared 8 GB host (docs/readiness/20). Tune after the read-only memory check.
    mem_limit: 64m
    cpus: 0.1
    logging: *default-logging
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: { context: ., dockerfile: Dockerfile, args: *build-args }
    restart: unless-stopped
    # Staging must never starve production on the shared 8 GB host (docs/readiness/20). Tune after the read-only memory check.
    mem_limit: 400m
    cpus: 0.5
    logging: *default-logging
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env.staging
    environment: *app-env
    # Loopback only; the reverse proxy (with its own access control) is the only way in. Host port differs from production's.
    ports:
      - '127.0.0.1:3200:3000'
    command: ['node', 'server.js']
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: { context: ., dockerfile: Dockerfile, args: *build-args }
    restart: unless-stopped
    # Staging must never starve production on the shared 8 GB host (docs/readiness/20). Tune after the read-only memory check.
    mem_limit: 256m
    cpus: 0.3
    logging: *default-logging
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env.staging
    environment: *app-env
    command: ['npx', 'tsx', 'workers/index.ts']

  realtime:
    build: { context: ., dockerfile: Dockerfile, args: *build-args }
    restart: unless-stopped
    # Staging must never starve production on the shared 8 GB host (docs/readiness/20). Tune after the read-only memory check.
    mem_limit: 160m
    cpus: 0.2
    logging: *default-logging
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env.staging
    environment: *app-env
    command: ['npx', 'tsx', 'workers/realtime-server.ts']
    ports:
      - '127.0.0.1:${REALTIME_PORT:-3201}:${REALTIME_PORT:-3201}'

volumes:
  staging_postgres_data:
  staging_redis_data:
